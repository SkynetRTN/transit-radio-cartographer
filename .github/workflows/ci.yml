name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: tauri-app/uv.lock

      - name: Sync Python deps
        run: just sync

      - name: Lint
        run: just lint

      - name: Type-check
        run: just typecheck

      - name: Test
        run: just test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: tauri-app/app/.nvmrc
          cache: npm
          cache-dependency-path: tauri-app/app/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/app/src-tauri

      - name: Build web bundle
        run: just build

      - name: cargo check (Tauri shell)
        working-directory: tauri-app/app/src-tauri
        run: cargo check --release
