[project]
name = "radio-cartographer-engine"
version = "0.0.0"
description = "Python sidecar engine for Radio Cartographer (I/O, numerics, JSON-RPC)."
requires-python = "==3.13.*"
dependencies = [
    "astropy>=7.2.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radio_cartographer"]
