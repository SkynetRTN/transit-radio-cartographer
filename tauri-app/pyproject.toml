[project]
name = "radio-cartographer-workspace"
version = "0.0.0"
description = "uv workspace root for the Radio Cartographer Tauri port."
requires-python = "==3.13.*"
dependencies = [
    "numpy>=2.4.4",
]

[tool.uv.workspace]
members = ["engine"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyinstaller>=6.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine/src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["engine/src"]
